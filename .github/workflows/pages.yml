name: Publish BuiEdu Preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - '*.mjs'
      - '.github/workflows/pages.yml'
      - 'tests/*.test.mjs'
      - 'civilization-lab/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: buiedu-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check chat-first website
        run: |
          node --check main.mjs
          node --check i18n.mjs
          node --check guided-discovery.mjs
          node --check intent-router.mjs
          node --check workplace-spreadsheet-csv.mjs
          node --check learning-workspace.mjs
          node --check career-desk-ui.mjs
          node --check quote-studio.mjs
          node --test tests/*.test.mjs
      - name: Prepare public-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html styles.css main.mjs i18n.mjs config.mjs auth.mjs companion-api.mjs guided-discovery.mjs intent-router.mjs workplace-spreadsheet-csv.mjs learning-workspace.mjs career-desk-ui.mjs quote-studio.mjs public/
          touch public/.nojekyll
          test -s public/index.html
          test "$(find public -maxdepth 1 -type f | wc -l)" -eq 14
          # Isolated static preview; BuiEdu root and build remain unchanged.
          mkdir -p public/civilization-lab
          cp civilization-lab/index.html civilization-lab/legacy-v07.html civilization-lab/engine-v06.js civilization-lab/evidence-v07.js civilization-lab/v08-preview.html civilization-lab/v08-atlas.js civilization-lab/v08-reason.js civilization-lab/v08-app.js civilization-lab/RESEARCH_PROTOCOL_v08.md civilization-lab/v09-preview.html civilization-lab/v09-engine.js civilization-lab/v09-app.js civilization-lab/v10-review.js civilization-lab/v10-portfolio.js civilization-lab/v10-workspace.js civilization-lab/v11-interview.js civilization-lab/v11-ui.js civilization-lab/v11-toggle.js civilization-lab/v11-style.css public/civilization-lab/
          node --check public/civilization-lab/engine-v06.js
          node --check public/civilization-lab/evidence-v07.js
          node --test civilization-lab/model.test.cjs
          node --check civilization-lab/v08-atlas.js
          node --check civilization-lab/v08-reason.js
          node --check civilization-lab/v08-app.js
          node --test civilization-lab/v08.test.cjs
          node --check civilization-lab/v09-engine.js
          node --check civilization-lab/v09-app.js
          node --test civilization-lab/v09.test.cjs
          node --check civilization-lab/v10-review.js
          node --check civilization-lab/v10-portfolio.js
          node --check civilization-lab/v10-workspace.js
          node --test civilization-lab/v10.test.cjs
          node --check civilization-lab/v11-interview.js
          node --check civilization-lab/v11-ui.js
          node --check civilization-lab/v11-toggle.js
          node --test civilization-lab/v11.test.cjs
          test -s public/civilization-lab/index.html
          test -s public/civilization-lab/engine-v06.js
          test -s public/civilization-lab/evidence-v07.js
          test -s public/civilization-lab/v08-app.js
          test -s public/civilization-lab/RESEARCH_PROTOCOL_v08.md
          grep -q "Guided Situation Interview" public/civilization-lab/index.html
          test -s public/civilization-lab/v09-engine.js
          test -s public/civilization-lab/v09-app.js
          test -s public/civilization-lab/v10-workspace.js
          test -s public/civilization-lab/v10-review.js
          test -s public/civilization-lab/v10-portfolio.js
          grep -q "v1.1" public/civilization-lab/index.html
          test -s public/civilization-lab/v11-interview.js
          test -s public/civilization-lab/v11-ui.js
          test -s public/civilization-lab/v11-style.css
          ! grep -R -E 'api[_-]?key|sk-proj-' public/*.mjs || exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
