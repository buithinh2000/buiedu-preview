name: Publish BuiEdu Preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - '*.mjs'
      - '.github/workflows/pages.yml'
      - 'tests/*.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: buiedu-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check chat-first website
        run: |
          node --check main.mjs
          node --check i18n.mjs
          node --check guided-discovery.mjs
          node --check intent-router.mjs
          node --check workplace-spreadsheet-csv.mjs
          node --test tests/*.test.mjs
      - name: Prepare public-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html styles.css main.mjs i18n.mjs config.mjs auth.mjs companion-api.mjs guided-discovery.mjs intent-router.mjs workplace-spreadsheet-csv.mjs public/
          touch public/.nojekyll
          test -s public/index.html
          test "$(find public -maxdepth 1 -type f | wc -l)" -eq 11
          ! grep -R -E 'api[_-]?key|sk-proj-' public/*.mjs || exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
